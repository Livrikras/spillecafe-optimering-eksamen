<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spilcafeén</title>
     <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../css/app.css" />
  </head>

  <body class="location-body">

    <div class="location-titel">
      <h1>Vælg Spilcafé</h1>
      <p>Hvor har du lyst til at spille?</p>
    </div>
    <main class="location-main">
      <section class="locations">
          <ul class="location-grid" id="locationGrid">
            <li class="location-card">
              <a href="spilgalleri.html?location=Vestergade">
                <img  src="../img/location-1.webp" alt="Spilcaféen Vestergade, Aarhus" loading="eager" class="location-image" fetchpriority="high"/>
                <div class="location-content">
                  <div>
                    <h2>Aarhus</h2>
                    <p>Vestergade</p>
                  </div>
                  <span class="arrow">›</span>
                </div>
              </a>
            </li>

            <li class="location-card">
              <a href="spilgalleri.html?location=Fredensgade">
                <img  src="../img/location-2.webp"  alt="Spilcaféen Fredensgade, Aarhus" class="location-image"  loading="lazy" />
                <div class="location-content">
                  <div>
                    <h2>Aarhus</h2>
                    <p>Fredensgade</p>
                  </div>
                  <span class="arrow">›</span>
                </div>
              </a>
            </li>

            <li class="location-card">
              <a href="spilgalleri.html?location=Bredgade">
                <img src="../img/location-3.webp"  alt="Spilcaféen, Bredegade, Aalborg" class="location-image"  loading="lazy" />
                <div class="location-content">
                  <div>
                    <h2>Aalborg</h2>
                    <p>Bredegade</p>
                  </div>
                  <span class="arrow">›</span>
                </div>
              </a>
            </li>

            <li class="location-card">
              <a href="spilgalleri.html?location=Slotsgade">
                <img  src="../img/location-4.webp"  alt="Spilcaféen, Slotsgade, Odense" class="location-image" loading="lazy" />
                <div class="location-content">
                  <div>
                    <h2>Odense</h2>
                    <p>Slotsgade</p>
                  </div>
                  <span class="arrow">›</span>
                </div>
              </a>
            </li>

          </ul>

      </section>

    </main>
    <script src="../js/app.js"></script>
  </body>
</html>
